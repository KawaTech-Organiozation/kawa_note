# =============================================================================
# KawaMyCenter Full Stack - DESENVOLVIMENTO LOCAL
#
# Este arquivo preserva o fluxo local com `build`. O `docker-compose.yml`
# principal é o de produção (executado pelo Portainer) e consome imagens
# prontas do GHCR — ele não builda nada no servidor.
#
# Uso local:  docker compose -f docker-compose.local.yml up -d --build
#
# Includes: Backend API + Frontend SPA
# Database: EXTERNAL PostgreSQL (not containerized)
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # MIGRATION SERVICE
  # Responsibility: Execute database migrations before app startup
  # Container is ephemeral - runs once and exits on completion
  # Database: External PostgreSQL (configured via DATABASE_URL)
  # ---------------------------------------------------------------------------
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: migrate
    container_name: kawa_note-migrate
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}
    networks:
      - kawatech-network
    restart: "no"

  # ---------------------------------------------------------------------------
  # BACKEND API SERVICE
  # Responsibility: Serve the backend API
  # Waits for migration to complete successfully before starting
  # ---------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runtime
    container_name: kawa_note-api
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      PORT: ${BACKEND_PORT}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
    networks:
      kawatech-network:
        aliases:
          - kawa-note-api
    ports:
      - "${BACKEND_PORT}:${BACKEND_PORT}"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      # A imagem da API e node:20-slim, que nao traz wget; usamos o fetch
      # global do Node 20 em vez de instalar um pacote so para o healthcheck.
      test: ["CMD", "node", "-e", "fetch('http://localhost:'+(process.env.PORT||3115)+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ---------------------------------------------------------------------------
  # FRONTEND APP SERVICE
  # Responsibility: Serve the React SPA via nginx
  # ---------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: runtime
      args:
        VITE_APP_NAME: ${VITE_APP_NAME:-KawaMyCenter}
        VITE_KAWA_APP_ID: ${VITE_KAWA_APP_ID:-test-app}
        VITE_KAWA_FUNCTIONS_VERSION: ${VITE_KAWA_FUNCTIONS_VERSION:-v1}
        VITE_KAWA_APP_BASE_URL: ${VITE_KAWA_APP_BASE_URL:-http://localhost:3116}
        VITE_CEP_API_URL: ${VITE_CEP_API_URL:-}
    container_name: kawa_note-app
    restart: unless-stopped
    networks:
      - kawatech-network
    ports:
      - "${FRONTEND_PORT}:80"
    environment:
      - NODE_ENV=production
    healthcheck:
      # 127.0.0.1 e nao localhost: a rede tem IPv6 e o /etc/hosts resolve
      # localhost para ::1 primeiro, mas o nginx escuta so em 0.0.0.0:80 —
      # com o nome o healthcheck levava "connection refused".
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

# -----------------------------------------------------------------------------
# NETWORK CONFIGURATION
# External network - must be created beforehand
# Network name and IPs are parametrized via .env
# -----------------------------------------------------------------------------
networks:
  kawatech-network:
    external: true
    name: ${DOCKER_NETWORK_NAME}
